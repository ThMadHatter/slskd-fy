# Default non-interactive Beets configuration for Track Portal
directory: /music
library: /config/beets/library.db

import:
  quiet: yes
  write: yes
  move: yes
  resume: no
  incremental: yes
  quiet_fallback: skip
  log: /config/beets/import.log

plugins: musicbrainz web

web:
  host: 0.0.0.0
  port: 8337

musicbrainz:
  searchlimit: 5
