# Non-interactive Beets configuration for Track Portal with full plugin support

plugins: >
  fromfilename
  musicbrainz
  fetchart
  embedart
  scrub
  lastgenre
  chroma
  web
  duplicates
  info
  missing

acoustid:
  apikey: xxxxxxxx

chroma:
  auto: yes

directory: /music
library: ~/.config/beets/library.db
art_filename: albumart
threaded: yes
original_date: no
per_disc_numbering: no

import:
  quiet: yes
  timid: no
  write: yes
  move: yes
  resume: no
  incremental: yes
  quiet_fallback: skip
  log: ~/.config/beets/import.log

convert:
  auto: no
  ffmpeg: /usr/bin/ffmpeg
  opts: -ab 320k -ac 2 -ar 48000
  max_bitrate: 320
  threads: 1

paths:
  default: $albumartist/$year - $album/$track - $title
  singleton: Non-Album/$artist - $title
  comp: Compilations/$album%aunique{}/$track - $title
  albumtype_soundtrack: Soundtracks/$album/$track $title

lastgenre:
  auto: yes
  source: album

embedart:
  auto: yes

fetchart:
  auto: yes

replaygain:
  auto: no
  backend: ffmpeg

scrub:
  auto: no

replace:
  '^\.': _
  '[\x00-\x1f]': _
  '[<>:"\?\*\|]': _
  '[\xE8-\xEB]': e
  '[\xEC-\xEF]': i
  '[\xE2-\xE6]': a
  '[\xF2-\xF6]': o
  '[\xF8]': o
  '\.$': _
  '\s+$': ''

web:
  host: 0.0.0.0
  port: 8337

musicbrainz:
  host: musicbrainz.org
  https: yes
  ratelimit: 1
  searchlimit: 5

match:
  strong_rec_thresh: 0.35
