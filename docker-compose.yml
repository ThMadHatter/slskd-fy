services:
  track-portal:
    build: .
    container_name: track_portal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # slskd API connection
      - SLSKD_API_URL=$SLSKD_API_URL
      - SLSKD_API_KEY=$SLSKD_API_KEY

      # Container paths mapped to mounted directories
      - MUSIC_LIBRARY_PATH=$MUSIC_LIBRARY_PATH
      - UPLOADS_PATH=$UPLOADS_PATH
      - SINGLES_PATH=$SINGLES_PATH
      - DOWNLOADS_PATH=$DOWNLOADS_PATH

      # SQLite Database location inside config folder
      - DATABASE_URL=$DATABASE_URL

      # Administration security & auth
      - SECRET_KEY=$SECRET_KEY
      - ADMIN_USERNAME=$ADMIN_USERNAME
      - ADMIN_PASSWORD=$ADMIN_PASSWORD

      # Navidrome connection
      - NAVIDROME_URL=$NAVIDROME_URL
      - NAVIDROME_USER=$NAVIDROME_USER
      - NAVIDROME_PASSWORD=$NAVIDROME_PASSWORD

      # Optional external dashboard links
      - FILEBROWSER_URL=$FILEBROWSER_URL
      - NAVIDROME_UI_URL=$NAVIDROME_UI_URL

      # Configurable quality preference ranking order
      - QUALITY_RANKING=$QUALITY_RANKING
    volumes:
      # Host path mounts based on context
      - /mnt/music/Music:/music
      - /mnt/music/Uploads:/uploads
      - /mnt/music/Downloads/slskd:/downloads
      - /mnt/music/Config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
